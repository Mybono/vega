name: metrics

on:
  schedule:
    # 03:17 UTC — an off-peak, off-the-hour slot, since GitHub delays cron jobs
    # scheduled on the hour under load.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot download counts and traffic
        env:
          # The traffic API needs Administration:read, which GITHUB_TOKEN cannot
          # be granted — `permissions:` has no key for it. Without METRICS_TOKEN
          # (a PAT with that scope) the traffic half is skipped and only the
          # download counters are recorded.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./metrics/snapshot.sh

      - name: Commit the snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- metrics; then
            echo "counters unchanged since the last snapshot; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git commit -m "chore(metrics): snapshot $(date -u +%Y-%m-%d)"
          git push
